<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>El Mundo de Caramelia y Fantasías</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Baloo+2:wght@400;600;800&display=swap">
<style>
/* Layout: mundo 3D a pantalla completa; marcador con la cara del personaje arriba, objetivo abajo, retos en tarjetas superpuestas. Tema fijo de cuento al atardecer. */
:root {
  --sky: #2a1b52;
  --panel: #fff7fb;
  --panel-2: #ffe9f4;
  --ink: #3a2160;
  --muted: #8a6fae;
  --berry: #e8457c;
  --berry-deep: #b82b5c;
  --mint: #2fb98a;
  --lemon: #ffd23f;
  --sky-blue: #5fb8ff;
  --lilac: #a985ff;
  --edge: #f3c1dc;
  --glass: rgba(255, 247, 251, .9);
  --display: "Lilita One", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--sky); color: var(--ink); font-family: var(--body); font-size: 18px; line-height: 1.4; overflow: hidden; -webkit-user-select: none; user-select: none; }
#world { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

.hud { position: fixed; left: 0; right: 0; top: 0; padding: calc(env(safe-area-inset-top, 0px) + 10px) 12px 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; pointer-events: none; z-index: 5; }
.hud-left { display: flex; gap: 10px; align-items: flex-start; min-width: 0; }
.hud-col { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; min-width: 0; }
.hud-right { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; pointer-events: auto; max-width: 52vw; }
.pill { background: var(--glass); border: 3px solid var(--edge); border-radius: 999px; padding: 1px 12px; font-weight: 800; white-space: nowrap; font-variant-numeric: tabular-nums; box-shadow: 0 3px 0 rgba(58,33,96,.18); }
.pill .lbl { font-weight: 600; color: var(--muted); font-size: 13px; margin-right: 4px; }
#area { font-family: var(--display); font-weight: 400; color: var(--berry); font-size: 19px; max-width: 46vw; overflow: hidden; text-overflow: ellipsis; }
#faceSlot { width: 84px; height: 84px; border-radius: 50%; border: 4px solid #fff; background: radial-gradient(circle at 50% 35%, #fff4c7, #ffb3d1); box-shadow: 0 4px 0 var(--berry-deep), 0 6px 14px rgba(0,0,0,.25); overflow: hidden; pointer-events: auto; cursor: pointer; padding: 0; flex: none; }
#faceSlot canvas, #mFace canvas { width: 100%; height: 100%; display: block; }
#mini { width: 140px; height: 125px; border-radius: 12px; border: 3px solid var(--edge); background: rgba(42, 27, 82, .75); }
.icon-btn { background: var(--glass); color: var(--ink); border: 3px solid var(--edge); border-radius: 999px; padding: 1px 12px; font: inherit; font-weight: 800; cursor: pointer; box-shadow: 0 3px 0 rgba(58,33,96,.18); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--lilac); outline-offset: 2px; }
#saved { font-size: 14px; }

#objective { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); z-index: 5; max-width: min(580px, calc(100% - 32px)); text-align: center; background: var(--glass); border: 3px solid var(--edge); border-radius: 18px; padding: 6px 14px; font-weight: 700; pointer-events: none; box-shadow: 0 4px 0 rgba(58,33,96,.18); }
#objective b { color: var(--berry); }
#toast { position: fixed; left: 50%; top: 30%; transform: translate(-50%, -50%); z-index: 6; width: min(520px, calc(100% - 32px)); text-align: center; background: var(--panel); border: 4px solid var(--lemon); border-radius: 20px; padding: 12px 18px; font-weight: 700; pointer-events: none; opacity: 0; transition: opacity .35s; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
#toast.show { opacity: 1; }
#toast .t-title { font-family: var(--display); font-weight: 400; font-size: 26px; color: var(--berry); display: block; }
#toast em, .story em { color: var(--berry-deep); font-style: normal; font-weight: 800; }

#joy { position: fixed; left: calc(env(safe-area-inset-left, 0px) + 22px); bottom: calc(env(safe-area-inset-bottom, 0px) + 70px); width: 130px; height: 130px; border-radius: 50%; background: rgba(255, 255, 255, .25); border: 4px solid rgba(255, 255, 255, .7); z-index: 5; touch-action: none; }
#knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ff9cc2, var(--berry-deep)); box-shadow: 0 4px 10px rgba(0,0,0,.35); }

.overlay { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px calc(env(safe-area-inset-bottom, 0px) + 12px); background: rgba(42, 27, 82, .45); }
.card { width: min(720px, 100%); max-height: 100%; overflow-y: auto; background: var(--panel); border: 4px solid var(--edge); border-radius: 26px; padding: clamp(16px, 4vw, 28px); box-shadow: 0 8px 0 var(--edge), 0 20px 50px rgba(0, 0, 0, .35); animation: rise .3s ease-out; -webkit-user-select: text; user-select: text; }
@keyframes rise { from { transform: translateY(14px) scale(.98); } to { transform: none; } }
.logo { font-family: var(--display); font-weight: 400; font-size: clamp(34px, 8vw, 54px); color: var(--berry); margin: 0; line-height: 1.02; text-shadow: 0 4px 0 var(--lemon); text-wrap: balance; letter-spacing: .5px; }
h2 { font-family: var(--display); font-weight: 400; font-size: clamp(26px, 6vw, 34px); margin: 2px 0 6px; color: var(--berry); text-wrap: balance; line-height: 1.1; }
h3 { font-family: var(--display); font-weight: 400; font-size: 22px; margin: 14px 0 6px; color: var(--ink); }
.tag { font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--mint); font-weight: 800; }
.story { margin: 0 0 12px; }
.big-art { font-size: clamp(54px, 14vw, 84px); text-align: center; animation: wobble 2.6s ease-in-out infinite; }
@keyframes wobble { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg) translateY(-4px); } }

.talk { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; }
#mFace { width: 64px; height: 64px; border-radius: 50%; border: 3px solid var(--edge); background: radial-gradient(circle at 50% 35%, #fff4c7, #ffb3d1); overflow: hidden; flex: none; }
.npc-face { width: 64px; height: 64px; border-radius: 50%; border: 3px solid var(--edge); background: var(--panel-2); display: grid; place-items: center; font-size: 38px; flex: none; }
.bubble { position: relative; background: var(--panel-2); border: 3px solid var(--edge); border-radius: 16px; padding: 6px 12px; font-weight: 600; flex: 1; min-width: 0; }
.bubble b { color: var(--berry-deep); }

.cat { display: inline-block; font-size: 13px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; padding: 2px 10px; border-radius: 999px; margin-bottom: 8px; color: #fff; }
.cat.mates { background: #ff7a45; }
.cat.geo { background: var(--mint); }
.cat.geom { background: #e0a800; }
.cat.jero { background: #a0703a; }
.cat.adiv { background: var(--lilac); }
.cat.mini { background: var(--sky-blue); }
.cat.gold { background: linear-gradient(90deg, #ffcf3f, #e09a00); }
.q { font-size: 20px; font-weight: 700; margin: 0 0 12px; }
.figure { display: flex; justify-content: center; margin: 6px 0 12px; overflow-x: auto; }
.figure svg { max-width: 100%; height: auto; }
.rebus { font-size: clamp(40px, 11vw, 60px); text-align: center; font-weight: 800; letter-spacing: 2px; margin: 4px 0 10px; color: var(--berry); }
.cipher { font-size: clamp(30px, 8vw, 44px); text-align: center; letter-spacing: 6px; margin: 6px 0 10px; background: #fff3d6; border: 3px solid #e9c98f; border-radius: 14px; padding: 6px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 10px; }
.legend span { background: #fff; border: 2px solid var(--edge); border-radius: 10px; padding: 2px 8px; font-weight: 800; font-size: 18px; }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.btn { font: inherit; font-weight: 800; font-size: 19px; cursor: pointer; background: #fff; color: var(--ink); border: 3px solid var(--edge); border-radius: 16px; padding: 9px 14px; box-shadow: 0 4px 0 var(--edge); transition: transform .1s; }
.btn:hover:not(:disabled) { transform: translateY(-2px); border-color: var(--berry); }
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 2px 0 var(--edge); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.opt:disabled { text-decoration: line-through; }
.btn.primary { background: var(--berry); color: #fff; border-color: var(--berry-deep); box-shadow: 0 5px 0 var(--berry-deep); }
.btn.green { background: var(--mint); color: #fff; border-color: #1f8a66; box-shadow: 0 5px 0 #1f8a66; }
.btn.ghost { background: transparent; color: var(--muted); border-color: transparent; box-shadow: none; font-size: 16px; }
.answer-row, .intro-input, .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row { margin-top: 14px; }
.answer-row input, .intro-input input { font: inherit; font-weight: 800; background: #fff; color: var(--ink); border: 3px solid var(--edge); border-radius: 14px; padding: 6px 12px; }
.answer-row input { font-size: 24px; width: 140px; text-align: center; }
.intro-input input { font-size: 20px; flex: 1 1 200px; min-width: 0; }
.feedback { min-height: 26px; margin-top: 10px; font-weight: 800; }
.feedback.bad { color: #d6336c; }
.feedback.good { color: #1f8a66; }
.hint { margin-top: 8px; background: #fff3c4; border-left: 5px solid var(--lemon); padding: 8px 12px; border-radius: 10px; color: #7a5a00; font-weight: 600; }
.shake { animation: shake .4s; }
@keyframes shake { 20%,60% { transform: translateX(-8px); } 40%,80% { transform: translateX(8px); } }

/* Selector de personaje */
.picker { display: grid; grid-template-columns: minmax(0, 1fr) 200px; gap: 14px; align-items: start; }
#pvSlot { width: 200px; height: 240px; border-radius: 20px; border: 3px solid var(--edge); background: radial-gradient(circle at 50% 40%, #fff6d6, #ffc3dc 70%, #d9b8ff); overflow: hidden; }
#pvSlot canvas { width: 100%; height: 100%; display: block; }
.skins { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.skin { font: inherit; text-align: center; background: #fff; border: 3px solid var(--edge); border-radius: 16px; padding: 6px 4px; cursor: pointer; color: var(--ink); font-weight: 700; font-size: 15px; line-height: 1.15; }
.skin .s-ic { font-size: 30px; display: block; }
.skin.sel { border-color: var(--berry); background: var(--panel-2); box-shadow: 0 0 0 3px rgba(232,69,124,.25); }
.skin .price { display: block; font-size: 13px; color: var(--berry-deep); }
.tones { display: flex; gap: 8px; margin-top: 8px; align-items: center; flex-wrap: wrap; }
.tone { width: 36px; height: 36px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 2px var(--edge); cursor: pointer; padding: 0; }
.tone.sel { box-shadow: 0 0 0 4px var(--berry); }
.save-card { background: #e9fbf4; border: 3px solid #9fe3c8; border-radius: 18px; padding: 10px 14px; margin: 10px 0; }
.controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px; margin: 10px 0; }
.controls div { background: var(--panel-2); border: 2px solid var(--edge); border-radius: 12px; padding: 8px 10px; font-size: 16px; }
.controls b { color: var(--berry-deep); }
kbd { background: #fff; border: 2px solid var(--edge); border-bottom-width: 4px; border-radius: 6px; padding: 0 6px; font-family: var(--body); font-weight: 800; font-size: 14px; }
.shop-items { display: grid; gap: 8px; }
.shop-item { display: flex; gap: 10px; align-items: center; background: var(--panel-2); border: 2px solid var(--edge); border-radius: 14px; padding: 8px 12px; }
.shop-item .si-ic { font-size: 32px; }
.shop-item .si-txt { flex: 1; min-width: 0; font-weight: 600; }

/* Minijuegos */
.mg-canvas { display: block; width: 100%; max-width: 340px; margin: 0 auto; border-radius: 16px; border: 3px solid var(--edge); touch-action: none; background: #2a1b52; }
.mg-canvas.tet { max-width: 300px; width: 300px; }
.mg-status { text-align: center; font-weight: 800; margin: 8px 0; font-variant-numeric: tabular-nums; }
.tet-wrap { display: flex; flex-direction: column; gap: 8px; align-items: center; }
.tet-wrap .mg-canvas { margin: 0; }
.tet-ctrl { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; width: 300px; }
.tet-ctrl .btn { font-size: 24px; padding: 6px 0; min-width: 0; }
/* En la torre de dulces el tablero manda: fuera la burbuja del dragón y texto más corto, para que se vea grande en el móvil */
.card.mini-mode.mini-tetris .talk { display: none; }
.card.mini-mode.mini-tetris .story { font-size: 13px; line-height: 1.25; margin: 2px 0 4px; }
.mem-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; max-width: 360px; margin: 0 auto; }
.mem-card { aspect-ratio: 1; font-size: clamp(26px, 8vw, 38px); border-radius: 14px; border: 3px solid var(--edge); background: repeating-linear-gradient(45deg, #ffb3d1 0 8px, #ffd0e3 8px 16px); cursor: pointer; color: var(--ink); padding: 0; }
.mem-card.up { background: #fff; }
.mem-card.done { background: #c8f5dc; border-color: var(--mint); }
.simon { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; max-width: 300px; margin: 0 auto; }
.simon button { aspect-ratio: 1.3; border-radius: 20px; font-size: 44px; border: 4px solid rgba(0,0,0,.2); cursor: pointer; opacity: .5; transition: opacity .1s, transform .1s; }
.simon button.lit { opacity: 1; transform: scale(1.06); box-shadow: 0 0 26px currentColor; }
.endings { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; margin-top: 8px; }
.end-slot { text-align: center; border: 2px solid var(--edge); border-radius: 14px; padding: 8px 6px; background: #fff; font-size: 14px; font-weight: 700; }
.end-slot .e-art { font-size: 28px; }
.end-slot.locked { opacity: .5; }
.end-slot.found { border-color: var(--mint); background: #e9fbf4; }
.score { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin: 10px 0; }
.candy { position: fixed; top: -40px; font-size: 28px; pointer-events: none; z-index: 20; animation: drop linear forwards; }
@keyframes drop { to { transform: translateY(110vh) rotate(540deg); } }
#loading { position: fixed; inset: 0; display: grid; place-items: center; font-family: var(--display); font-size: 30px; color: var(--lemon); z-index: 30; background: var(--sky); }

@media (max-width: 640px) {
  #mini { width: 96px; height: 86px; }
  #faceSlot { width: 64px; height: 64px; }
  #area { font-size: 15px; max-width: 34vw; }
  .pill { font-size: 15px; padding: 0 8px; }
  .pill .lbl { display: none; }
  #objective { font-size: 15px; bottom: calc(env(safe-area-inset-bottom, 0px) + 8px); }
  #joy { bottom: calc(env(safe-area-inset-bottom, 0px) + 64px); width: 116px; height: 116px; }
  .picker { grid-template-columns: 1fr; }
  #pvSlot { width: 150px; height: 180px; margin: 0 auto; order: -1; }
}
body.touch #objective { left: 12px; right: 112px; transform: none; max-width: none; text-align: left; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
/* Mapa de niveles, vestidor, jefe y minijuegos nuevos */
.worlds { display: grid; gap: 12px; }
.world { border: 3px solid var(--edge); border-radius: 18px; padding: 8px 12px 12px; background: var(--panel-2); }
.world h3 { margin: 0 0 6px; }
.lvls { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.lvl { font: inherit; border: 3px solid var(--edge); background: #fff; border-radius: 14px; padding: 6px 4px; font-weight: 800; cursor: pointer; color: var(--ink); line-height: 1.15; box-shadow: 0 3px 0 var(--edge); }
.lvl .ln { font-family: var(--display); font-size: 24px; color: var(--berry); display: block; }
.lvl .st { font-size: 13px; letter-spacing: 1px; display: block; min-height: 16px; }
.lvl .nm { font-size: 12px; font-weight: 600; color: var(--muted); display: block; }
.lvl.locked { opacity: .45; cursor: not-allowed; }
.lvl.next { border-color: var(--berry); box-shadow: 0 0 0 3px rgba(232,69,124,.3); }
.lvl.boss { width: 100%; margin-top: 4px; background: linear-gradient(90deg, #3b1f5e, #7a3a8a); color: #fff; border-color: #2a1440; box-shadow: 0 3px 0 #2a1440; }
.lvl.boss .ln { color: var(--lemon); }
.lvl.boss .nm { color: #f3d9ff; }
.summary { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 12px; }
.ward { display: grid; grid-template-columns: minmax(0, 1fr) 200px; gap: 14px; align-items: start; }
.ward-panel { background: var(--panel-2); border: 3px solid var(--edge); border-radius: 16px; padding: 10px 12px; margin-top: 10px; }
.ward-panel ul { margin: 6px 0; padding-left: 20px; }
.lvstars { color: #e0a800; letter-spacing: 2px; font-size: 18px; }
.skin .lvstars { font-size: 13px; display: block; }
.big-stars { font-size: 46px; text-align: center; letter-spacing: 6px; }
.sd-grid { display: grid; grid-template-columns: repeat(4, 1fr); max-width: 280px; margin: 0 auto; border: 4px solid var(--ink); border-radius: 12px; overflow: hidden; }
.sd-cell { aspect-ratio: 1; font-size: 30px; border: 1px solid #d9c2e8; background: #fff; padding: 0; cursor: pointer; }
.sd-cell.given { background: #f3e8ff; cursor: default; }
.sd-cell.bad { background: #ffd6de; }
.sd-cell:nth-child(4n+2) { border-right: 3px solid var(--ink); }
.sd-cell:nth-child(n+5):nth-child(-n+8) { border-bottom: 3px solid var(--ink); }
.palette { display: flex; gap: 8px; justify-content: center; margin: 10px 0 4px; flex-wrap: wrap; }
.palette .btn { font-size: 26px; padding: 4px 12px; }
.palette .btn.sel { border-color: var(--berry); background: var(--panel-2); box-shadow: 0 0 0 3px rgba(232,69,124,.3); }
.lo-grid { display: grid; gap: 8px; margin: 0 auto; max-width: 300px; }
.lo-cell { aspect-ratio: 1; border-radius: 14px; border: 3px solid var(--edge); font-size: 30px; cursor: pointer; background: #3a2768; padding: 0; }
.lo-cell.on { background: radial-gradient(circle, #fff3a0, #ffd23f); }
.ms-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-width: 300px; margin: 0 auto; }
.ms-cell { aspect-ratio: 1.2; display: grid; place-items: center; font-size: 40px; background: #fff; border: 3px solid var(--edge); border-radius: 14px; }
.mg-canvas.flow { max-width: 300px; }
#bossbar { position: fixed; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 58px); z-index: 5; width: min(340px, calc(100% - 32px)); background: var(--glass); border: 3px solid #6a3a8a; border-radius: 14px; padding: 3px 10px 6px; font-weight: 800; text-align: center; pointer-events: none; }
#bossbar .bar { height: 12px; border-radius: 6px; background: #e9d8ff; overflow: hidden; margin-top: 3px; }
#bossbar .fill { height: 100%; background: linear-gradient(90deg, #6a3a8a, #e8457c); transition: width .4s; }
@media (max-width: 640px) {
  .ward { grid-template-columns: 1fr; }
  .ward #pvSlot { order: -1; }
  #bossbar { top: calc(env(safe-area-inset-top, 0px) + 112px); }
  .lvl .nm { display: none; }
}
.cat.logica { background: #3bc9db; }

.card.mini-mode { height: 100%; overflow: hidden; display: flex; flex-direction: column; padding: 12px 16px; }
.card.mini-mode .talk { margin: 2px 0 4px !important; }
.card.mini-mode .npc-face, .card.mini-mode #mFace { width: 44px; height: 44px; font-size: 26px; }
.card.mini-mode .bubble { padding: 3px 10px; font-size: 15px; }
.card.mini-mode h2 { font-size: 24px; margin: 0; }
.card.mini-mode .cat { margin: 0; }
.card.mini-mode .story { font-size: 15px; margin: 2px 0 6px; line-height: 1.3; }
.card.mini-mode .tag { display: none; }
.mini-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.mg-fit { flex: 1 1 auto; min-height: 0; position: relative; overflow: hidden; }
.mg-stage { position: absolute; left: 50%; top: 0; width: 360px; transform-origin: top center; transform: translateX(-50%); }
.mini-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 4px; }
.mini-foot .timer { flex: 1; }
.timer { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums; margin-bottom: 6px; }
.mini-foot .timer { margin-bottom: 0; }
.timer .tbar { flex: 1; min-width: 60px; height: 10px; border-radius: 6px; background: #f3d9e8; overflow: hidden; }
.timer .tfill { height: 100%; background: linear-gradient(90deg, #e8457c, #ffd23f, #2fb98a); transition: width .25s linear; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.tab { font-size: 16px; padding: 5px 12px; }
.tab.sel { background: var(--berry); color: #fff; border-color: var(--berry-deep); }
.swatch { display: block; width: 34px; height: 34px; margin: 0 auto 4px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 2px var(--edge); }
#fireBtn { position: fixed; right: calc(env(safe-area-inset-right, 0px) + 18px); bottom: calc(env(safe-area-inset-bottom, 0px) + 72px); width: 86px; height: 86px; border-radius: 50%; border: 4px solid #fff; background: radial-gradient(circle at 35% 35%, #fff3a0, #ffb100); font-size: 34px; z-index: 6; box-shadow: 0 5px 0 #c98a00, 0 8px 18px rgba(0,0,0,.3); touch-action: none; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; cursor: pointer; color: var(--ink); font-family: var(--body); padding: 0; }
#fireBtn span { font-size: 12px; font-weight: 800; margin-top: 2px; }
#fireBtn:active { transform: translateY(3px); box-shadow: 0 2px 0 #c98a00; }
.cat.ingles { background: #1c4fa0; }
.cat.ciencia { background: #0ca678; }
.album { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 10px; }
.sticker { background: #f3eef7; border: 3px dashed #d9c8e6; border-radius: 16px; padding: 8px 6px; text-align: center; font-size: 13px; line-height: 1.2; color: var(--muted); display: flex; flex-direction: column; gap: 3px; }
.sticker .st-ic { font-size: 36px; filter: grayscale(1); opacity: .5; }
.sticker b { color: var(--ink); font-size: 14px; }
.sticker.got { background: linear-gradient(160deg, #fff, #ffe9f4); border: 3px solid #ffd23f; color: var(--ink); box-shadow: 0 4px 0 #f0c419; transform: rotate(-1.5deg); }
.sticker.got:nth-child(2n) { transform: rotate(1.5deg); }
.sticker.got .st-ic { filter: none; opacity: 1; }
@media (max-width: 640px) { .icon-btn .lbl { display: none; } }
#toast { z-index: 15; }
#toast { top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 74px); transform: translateX(-50%); width: auto; max-width: min(460px, calc(100% - 32px)); padding: 5px 14px; font-size: 15px; border-width: 3px; border-radius: 16px; line-height: 1.3; box-shadow: 0 4px 12px rgba(0,0,0,.2); }
#toast .t-title { font-size: 17px; display: inline; margin-right: 6px; }
body.touch #toast { left: 12px; right: 112px; transform: none; max-width: none; bottom: calc(env(safe-area-inset-bottom, 0px) + 66px); }
#objective { font-size: 14px; padding: 4px 12px; }
.diff-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 12px 0 2px; }
.diff-row .tag { margin-right: 4px; }
</style>

<body>
<canvas id="world" aria-label="Mundo 3D de Caramelia y Fantasías"></canvas>
<div class="hud">
  <div class="hud-left">
    <button id="faceSlot" title="Vestidor" aria-label="Tu personaje. Pulsa para abrir el vestidor"></button>
    <div class="hud-col"><div class="pill" id="area">Caramelia y Fantasías</div><canvas id="mini" width="148" height="132" aria-label="Mapa del nivel"></canvas></div>
  </div>
  <div class="hud-right" id="stats"></div>
</div>
<div id="bossbar" hidden></div>
<div id="objective"></div>
<div id="toast" role="status"></div>
<div id="joy" hidden><div id="knob"></div></div>
<button id="fireBtn" hidden aria-label="Lanzar rayo mágico">⚡<span>Rayo</span></button>
<div class="overlay" id="overlay"><div class="card" id="panel"></div></div>
<div id="loading">Abriendo el mundo de Caramelia…</div>

<script>
/* Si algo impide arrancar (por ejemplo, el navegador no tiene 3D), lo dice en pantalla en vez de quedarse en blanco. */
window.addEventListener("error", function (e) {
  if (document.getElementById("fatal")) return;
  var d = document.createElement("div"); d.id = "fatal";
  d.style.cssText = "position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:24px;background:#ffe3f1;color:#5a2a6e;font:18px/1.4 sans-serif;text-align:center";
  d.innerHTML = "<div><b style='font-size:24px'>¡Uy! El juego no ha podido arrancar 🍬</b><br><br>Prueba a abrirlo con Chrome, Edge, Firefox o Safari actualizados (no desde la vista previa del correo o de WhatsApp).<br><br><small>Detalle: " + String(e.message || e.error || "").replace(/</g, "&lt;") + "</small></div>";
  (document.body || document.documentElement).appendChild(d);
});
</script>

<script>
(function () {
  "use strict";
  // ================= Utilidades =================
  const rand = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const $ = id => document.getElementById(id);
  const lsGet = k => { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } };
  const lsSet = (k, v) => { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

  // ================= Sonido =================
  let audio = null, soundOn = false;
  function tone(freq, dur, type, when, vol) {
    if (!soundOn) return null;
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const t = audio.currentTime + (when || 0);
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = type || "sine"; o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(vol || .14, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
      o.connect(g); g.connect(audio.destination); o.start(t); o.stop(t + dur);
      return o;
    } catch (e) { return null; }
  }
  const sfx = {
    good() { [523, 659, 784, 1046].forEach((f, i) => tone(f, .25, "triangle", i * .09)); },
    bad() { const o = tone(330, .5, "sawtooth", 0, .08); if (o) o.frequency.exponentialRampToValueAtTime(150, audio.currentTime + .5); },
    gate() { [784, 988, 1175, 1568].forEach((f, i) => tone(f, .35, "sine", i * .07, .1)); },
    pick() { tone(1046, .1, "triangle", 0, .1); tone(1568, .12, "triangle", .05, .08); },
    hit() { tone(660, .08, "square", 0, .06); },
    win() { [523, 659, 784, 1046, 784, 1046, 1318].forEach((f, i) => tone(f, .3, "triangle", i * .13)); },
    sleep() { [392, 349, 330, 294].forEach((f, i) => tone(f, .5, "sine", i * .3, .14)); },
    zap() { const o = tone(300, .5, "sine", 0, .12); if (o) o.frequency.exponentialRampToValueAtTime(1600, audio.currentTime + .5); },
    coin() { tone(988, .08, "square", 0, .06); tone(1318, .2, "square", .08, .06); }
  };

  // ================= Dibujos SVG para los retos =================
  const STROKE = "#e8457c", TXT = "#3a2160";
  function polySVG(n) {
    const cx = 110, cy = 105, r = 80, pts = [];
    for (let i = 0; i < n; i++) { const a = -Math.PI / 2 + i * 2 * Math.PI / n; pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]); }
    return `<svg viewBox="0 0 220 215" width="220" role="img" aria-label="Polígono"><polygon points="${pts.map(p => p.map(v => v.toFixed(1)).join(",")).join(" ")}" fill="rgba(169,133,255,.2)" stroke="${STROKE}" stroke-width="5" stroke-linejoin="round"/><text x="${cx}" y="${cy + 12}" text-anchor="middle" font-size="34">🦋</text></svg>`;
  }
  function rectSVG(w, h, a, b, unit) {
    const x = (260 - w) / 2, y = 30;
    return `<svg viewBox="0 0 260 ${h + 80}" width="260" role="img" aria-label="Rectángulo de ${a} por ${b}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="rgba(47,185,138,.15)" stroke="${STROKE}" stroke-width="5"/><text x="130" y="${y - 8}" text-anchor="middle" fill="${TXT}" font-size="20" font-weight="800">${a} ${unit}</text><text x="${x + w + 8}" y="${y + h / 2 + 7}" fill="${TXT}" font-size="20" font-weight="800">${b} ${unit}</text></svg>`;
  }
  function triSVG(s) {
    return `<svg viewBox="0 0 240 210" width="240" role="img" aria-label="Triángulo de lados iguales"><polygon points="120,25 30,180 210,180" fill="rgba(169,133,255,.2)" stroke="${STROKE}" stroke-width="5" stroke-linejoin="round"/><text x="120" y="205" text-anchor="middle" fill="${TXT}" font-size="20" font-weight="800">${s} cm</text><text x="52" y="100" text-anchor="middle" fill="${TXT}" font-size="20" font-weight="800">${s} cm</text><text x="188" y="100" text-anchor="middle" fill="${TXT}" font-size="20" font-weight="800">${s} cm</text><text x="120" y="140" text-anchor="middle" font-size="34">🧙‍♀️</text></svg>`;
  }
  function angleSVG(deg) {
    const ox = 60, oy = 170, L = 150, a = deg * Math.PI / 180;
    const x2 = ox + L * Math.cos(a), y2 = oy - L * Math.sin(a);
    const r = 36, ax = ox + r * Math.cos(a), ay = oy - r * Math.sin(a);
    const arc = deg === 90 ? `<polyline points="${ox + 26},${oy} ${ox + 26},${oy - 26} ${ox},${oy - 26}" fill="none" stroke="#2fb98a" stroke-width="4"/>` : `<path d="M ${ox + r} ${oy} A ${r} ${r} 0 0 0 ${ax.toFixed(1)} ${ay.toFixed(1)}" fill="none" stroke="#2fb98a" stroke-width="4"/>`;
    return `<svg viewBox="0 0 260 190" width="260" role="img" aria-label="Un ángulo"><line x1="${ox}" y1="${oy}" x2="${ox + L + 40}" y2="${oy}" stroke="${STROKE}" stroke-width="6" stroke-linecap="round"/><line x1="${ox}" y1="${oy}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${STROKE}" stroke-width="6" stroke-linecap="round"/>${arc}<text x="${(x2 + 6).toFixed(1)}" y="${(y2 - 4).toFixed(1)}" font-size="26">🪄</text></svg>`;
  }
  function cubeSVG() {
    return `<svg viewBox="0 0 200 180" width="200" role="img" aria-label="Un cubo"><polygon points="40,60 120,60 120,150 40,150" fill="rgba(232,69,124,.2)" stroke="${STROKE}" stroke-width="4"/><polygon points="40,60 80,25 160,25 120,60" fill="rgba(255,210,63,.35)" stroke="${STROKE}" stroke-width="4"/><polygon points="120,60 160,25 160,115 120,150" fill="rgba(47,185,138,.25)" stroke="${STROKE}" stroke-width="4"/><text x="80" y="115" text-anchor="middle" font-size="34">💎</text></svg>`;
  }
  function moonSVG() {
    return `<svg viewBox="0 0 220 200" width="220" role="img" aria-label="Círculo con una línea por el centro"><circle cx="110" cy="100" r="80" fill="rgba(255,210,63,.3)" stroke="${STROKE}" stroke-width="5"/><line x1="30" y1="100" x2="190" y2="100" stroke="#2fb98a" stroke-width="6" stroke-linecap="round"/><circle cx="110" cy="100" r="6" fill="#2fb98a"/><text x="150" y="70" font-size="26">🦉</text></svg>`;
  }
  function squareSymSVG() {
    return `<svg viewBox="0 0 200 200" width="200" role="img" aria-label="Un cuadrado"><rect x="30" y="30" width="140" height="140" fill="rgba(47,185,138,.15)" stroke="${STROKE}" stroke-width="5"/><text x="100" y="118" text-anchor="middle" font-size="44">🦄</text></svg>`;
  }
  function chocoSVG(rows, cols) {
    const s = Math.min(34, Math.floor(220 / cols)), w = cols * s, h = rows * s, x0 = (240 - w) / 2;
    let cells = "";
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) cells += `<rect x="${x0 + c * s + 2}" y="${10 + r * s + 2}" width="${s - 4}" height="${s - 4}" rx="4" fill="#6b3a1d" stroke="#3c1f0d" stroke-width="2"/>`;
    return `<svg viewBox="0 0 240 ${h + 20}" width="240" role="img" aria-label="Tableta de chocolate de ${rows} por ${cols}">${cells}</svg>`;
  }
  const SAND = "#a0703a";
  function egyGlyph(v, x) {
    if (v === 1) return { w: 14, s: `<line x1="${x + 7}" y1="8" x2="${x + 7}" y2="46" stroke="${SAND}" stroke-width="5" stroke-linecap="round"/>` };
    if (v === 10) return { w: 32, s: `<path d="M${x + 4} 46 V26 A12 12 0 0 1 ${x + 28} 26 V46" fill="none" stroke="${SAND}" stroke-width="5" stroke-linecap="round"/>` };
    const cx = x + 16, cy = 27;
    return { w: 34, s: `<path d="M${cx} ${cy} a3 3 0 1 1 6 0 a6 6 0 1 1 -12 0 a9 9 0 1 1 18 0 a12 12 0 1 1 -24 0" fill="none" stroke="${SAND}" stroke-width="4" stroke-linecap="round"/>` };
  }
  function egySVG(n, label) {
    const parts = [];
    for (let i = 0; i < Math.floor(n / 100); i++) parts.push(100);
    for (let i = 0; i < Math.floor(n % 100 / 10); i++) parts.push(10);
    for (let i = 0; i < n % 10; i++) parts.push(1);
    let x = 10, body = "";
    parts.forEach(p => { const g = egyGlyph(p, x); body += g.s; x += g.w + 4; });
    return `<svg viewBox="0 0 ${x + 6} 56" width="${Math.min(340, (x + 6) * 1.3)}" role="img" aria-label="${label || "Número egipcio"}"><rect x="1" y="1" width="${x + 4}" height="54" rx="8" fill="#fff3d6" stroke="#e9c98f"/>${body}</svg>`;
  }
  function egyLegend() {
    return `<div class="legend">${[1, 10, 100].map(v => `<span>${egySVG(v, "Vale " + v).replace(/width="[^"]+"/, 'width="' + (v === 1 ? 34 : 54) + '"')} = ${v}</span>`).join("")}</div>`;
  }

  // ================= Bancos de retos =================
  const MATES = [
    () => { const n = rand(3, 9); return { q: `En el bosque hay ${n} arañas tejedoras. Cada araña tiene 8 patas. ¿Cuántas patas hay en total?`, type: "num", answer: n * 8, hint: `Multiplica ${n} × 8.` }; },
    () => { const k = rand(3, 8), each = rand(4, 9); return { q: `Tienes ${k * each} caramelos para repartir a partes iguales entre ${k} hadas. ¿Cuántos le tocan a cada una?`, type: "num", answer: each, hint: `Busca qué número multiplicado por ${k} da ${k * each}.` }; },
    () => { const t = rand(60, 120), o = rand(15, 45); return { q: `En el estanque había ${t} ranas. Saltaron fuera ${o}. ¿Cuántas ranas quedan?`, type: "num", answer: t - o, hint: `Es una resta: ${t} − ${o}.` }; },
    () => { const m = pick([15, 20, 25, 30, 35, 40, 45, 50]); return { q: `El reloj del castillo marca las 11:${m}. ¿Cuántos minutos faltan para las 12:00?`, type: "num", answer: 60 - m, hint: `Una hora tiene 60 minutos. ¿Cuánto le falta a ${m} para llegar a 60?` }; },
    () => { const a = rand(1, 3); return { q: `Las luciérnagas se encienden así: ${a}, ${a * 2}, ${a * 4}, ${a * 8}… ¿Cuántas se encenderán después?`, type: "num", answer: a * 16, hint: "Cada vez se enciende el doble que la anterior." }; },
    () => { const s = rand(5, 9); return { q: `Las piruletas del camino siguen esta serie: ${s}, ${s * 2}, ${s * 3}, ___, ${s * 5}. ¿Qué número falta?`, type: "num", answer: s * 4, hint: `Es la tabla del ${s}.` }; },
    () => { const per = rand(3, 6), n = rand(4, 9); return { q: `Cada poción mágica necesita ${per} pétalos de rosa. La maga tiene ${per * n}. ¿Cuántas pociones puede preparar?`, type: "num", answer: n, hint: `Divide ${per * n} entre ${per}.` }; },
    () => { const g = rand(2, 4), m = rand(12, 25); return { q: `En la cueva hay ${g} grupos de ${m} cristales. ¿Cuántos cristales hay en total?`, type: "num", answer: g * m, hint: `Multiplica ${m} × ${g}.` }; },
    () => { const a = rand(12, 25), b = rand(4, 9); return { q: `Una capa de maga cuesta ${a} monedas y una varita ${b}. Pagas con 50 monedas. ¿Cuántas te devuelven?`, type: "num", answer: 50 - a - b, hint: `Primero suma ${a} + ${b} y después réstalo de 50.` }; },
    () => { const n = 4 * rand(5, 15); return { q: `En el huerto del reino hay ${n} fresas. La cuarta parte son blancas. ¿Cuántas son blancas?`, type: "num", answer: n / 4, hint: "La cuarta parte es dividir entre 4: la mitad de la mitad." }; },
    () => { const f = pick([["1/2", "1/4"], ["1/3", "1/6"], ["3/4", "1/4"]]); return { q: `Dos dragones comparten una tarta. Uno se come ${f[0]} y el otro ${f[1]}. ¿Quién comió más?`, type: "mc", options: [`El de ${f[0]}`, `El de ${f[1]}`, "Comieron lo mismo"], answer: `El de ${f[0]}`, hint: "Si partes la tarta en menos trozos, cada trozo es más grande." }; }
  ];
  const GEO = [
    { q: "Un dragón sale de España volando hacia el norte y cruza los Pirineos. ¿A qué país llega?", options: ["Francia", "Portugal", "Italia", "Marruecos"], answer: "Francia", hint: "Su capital es París." },
    { q: "El castillo de Neuschwanstein inspiró muchos castillos de cuento. ¿En qué país está?", options: ["Alemania", "Japón", "México", "Egipto"], answer: "Alemania", hint: "Su capital es Berlín." },
    { q: "Una sirena navega por el río que pasa por Zaragoza. ¿Qué río es?", options: ["Ebro", "Guadalquivir", "Tajo", "Miño"], answer: "Ebro", hint: "De su nombre viene la palabra «Iberia»." },
    { q: "La Torre del Oro de Sevilla está junto a un río. ¿Cuál?", options: ["Guadalquivir", "Ebro", "Duero", "Júcar"], answer: "Guadalquivir", hint: "Su nombre viene del árabe y significa «río grande»." },

      const s = SKIN[wardSel], own = owns(s.id), u = upgOf(s.id), wearing = P.skin === s.id;
      pvSkin = s.id; pvUpg = own ? u : 1;
      let actions = "";
      if (!own) actions = `<button class="btn green" id="wBuy" ${P.candies >= s.price ? "" : "disabled"}>Desbloquear por ${s.price} 🍬</button>`;
      else {
        if (!wearing) actions += `<button class="btn primary" id="wWear">Ponerme este traje</button>`;
        if (u < 5) actions += `<button class="btn green" id="wUp" ${P.candies >= UPG_COST[u + 1] ? "" : "disabled"}>Mejorar a ${"★".repeat(u + 1)} por ${UPG_COST[u + 1]} 🍬</button>`;
      }
      body = `<div class="ward"><div>${skinCards(wardSel)}${toneRow(P.tone)}</div><div id="pvSlot" aria-label="Vista previa"></div></div>
        <div class="ward-panel"><b>${s.icon} ${s.name}</b> ${own ? `<span class="lvstars">${stars5(u)}</span>` : "🔒"}${wearing ? " · <b>¡Lo llevas puesto!</b>" : ""}
        <ul>${[2, 3, 4, 5].map(k => `<li>${"★".repeat(k)} ${UPG_PERK[k]}${u >= k ? " ✅" : ""}</li>`).join("")}</ul>
        <div class="row" style="margin-top:6px">${actions}</div></div>`;
    } else if (wardTab === "colores") {
      const cur = P.color[P.skin] || 0;
      body = `<div class="ward"><div><p class="story" style="margin:0 0 6px">Color del traje de <b>${SKIN[P.skin].name}</b>. Los colores que compres sirven para todos los trajes.</p><div class="skins">${DRESS_COLORS.map((c, i) => {
        const own = P.ownColors.includes(i);
        return `<button class="skin ${cur === i ? "sel" : ""}" data-col="${i}"><span class="swatch" style="background:${c.c == null ? "conic-gradient(#ff7fcf,#ffd23f,#63e6be,#5fb8ff,#ff7fcf)" : "#" + c.c.toString(16).padStart(6, "0")}"></span>${c.name}${own ? "" : `<span class="price">${c.price} 🍬</span>`}</button>`;
      }).join("")}</div></div><div id="pvSlot" aria-label="Vista previa"></div></div>`;
    } else if (wardTab === "accesorios") {
      body = `<div class="ward"><div>${itemCards(ACCS, P.ownAcc, P.acc, "acc")}</div><div id="pvSlot" aria-label="Vista previa"></div></div>`;
    } else {
      body = `<div class="ward"><div><p class="story" style="margin:0 0 6px">Tu mascota te sigue por los niveles y <b>recoge caramelos</b> por ti.</p>${itemCards(PETS, P.ownPets, P.pet, "pet")}</div><div id="pvSlot" aria-label="Vista previa"></div></div>`;
    }
    overlay(`<div class="tag">Vestidor de Gata Bombón</div><h2>Personaliza tu personaje</h2>
      <p class="story" style="margin:0 0 8px">Tienes <b>${P.candies} 🍬</b>. ${msg || "Cada traje se puede mejorar hasta ★★★★★."}</p>
      <div class="tabs">${tabs.map(t => `<button class="btn tab ${wardTab === t[0] ? "sel" : ""}" data-tab="${t[0]}">${t[1]}</button>`).join("")}</div>
      ${body}
      ${!inLevel && wardTab === "trajes" ? `<div class="intro-input" style="margin-top:10px"><label for="nm" class="tag" style="flex-basis:100%">Tu nombre</label><input id="nm" maxlength="20" autocomplete="off" value="${esc(P.name)}"></div>` : ""}
      <div class="row"><button class="btn primary" id="wBack">${inLevel ? "Volver al nivel" : "Listo"}</button></div>`);
    aux.rebuild(pvSkin, P.tone, pvUpg); aux.place($("pvSlot"), "body");
    const nm = $("nm"); if (nm) nm.onchange = () => { P.name = nm.value.trim() || P.name; saveNow(false); };
    const again = m => showWardrobe(back, m);
    const after = m => { checkStickers(true); placeHero(); if (S && L) { S.maxLives = Math.max(S.maxLives, maxLivesNow()); renderStats(); } saveNow(true); again(m); };
    const pay = (price, name) => { if (P.candies < price) { again(`Te faltan ${price - P.candies} caramelos para ${name}. ¡Sigue jugando!`); return false; } P.candies -= price; sfx.coin(); return true; };
    document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { wardTab = b.dataset.tab; again(); });
    document.querySelectorAll("[data-skin]").forEach(b => b.onclick = () => { wardSel = b.dataset.skin; again(); });
    document.querySelectorAll("[data-tone]").forEach(b => b.onclick = () => { P.tone = +b.dataset.tone; after(); });
    document.querySelectorAll("[data-col]").forEach(b => b.onclick = () => { const i = +b.dataset.col, c = DRESS_COLORS[i]; if (!P.ownColors.includes(i)) { if (!pay(c.price, "ese color")) return; P.ownColors.push(i); } P.color[P.skin] = i; after(`¡Color ${c.name} puesto!`); });
    document.querySelectorAll("[data-acc]").forEach(b => b.onclick = () => { const it = ACCS[+b.dataset.acc]; if (!P.ownAcc.includes(it.id)) { if (!pay(it.price, "ese accesorio")) return; P.ownAcc.push(it.id); } P.acc = it.id; after(it.id ? `¡${it.name} puesto!` : "Sin accesorio."); });
    document.querySelectorAll("[data-pet]").forEach(b => b.onclick = () => { const it = PETS[+b.dataset.pet]; if (!P.ownPets.includes(it.id)) { if (!pay(it.price, "esa mascota")) return; P.ownPets.push(it.id); } P.pet = it.id; after(it.id ? `¡${it.name} viene contigo!` : "Sin mascota."); });
    if ($("wBuy")) { const s = SKIN[wardSel]; $("wBuy").onclick = () => { if (!pay(s.price, "ese traje")) return; P.unlocked.push(s.id); P.skin = s.id; after(`¡El traje de ${s.name} ya es tuyo!`); }; }
    if ($("wWear")) $("wWear").onclick = () => { P.skin = wardSel; sfx.pick(); after(`¡Qué bien te queda el traje de ${SKIN[wardSel].name}!`); };
    if ($("wUp")) { const u = upgOf(wardSel); $("wUp").onclick = () => { if (!pay(UPG_COST[u + 1], "esa mejora")) return; P.upg[wardSel] = u + 1; sfx.win(); after(`¡Mejora conseguida! ${UPG_PERK[u + 1]}.`); }; }
    $("wBack").onclick = () => { wardSel = null; if (inLevel) { closeOverlay(); S.mode = "play"; applyState(); } else back(); };
  }
  $("faceSlot").onclick = () => { if (S && S.mode === "play") showWardrobe(null); };
  function askLeave() {
    if (!S || S.mode !== "play") return;
    S.mode = "modal"; for (const k in keys) keys[k] = false;
    overlay(`<h2>¿Volver al mapa?</h2><p class="story">Si sales ahora, tendrás que empezar el nivel ${S.n} otra vez. Los caramelos que has recogido se quedan contigo.</p>
      <div class="row"><button class="btn primary" id="lvStay">Seguir jugando</button><button class="btn" id="lvGo">Salir al mapa</button></div>`);
    $("lvStay").onclick = () => { closeOverlay(); S.mode = "play"; };
    $("lvGo").onclick = () => { SAVED = null; lsSet(SAVE_KEY, null); saveNow(false); showMap(); };
  }
  function startLevel(n, resume) {
    screenNow = "level";
    L = genLevel(n); music.set(L.boss ? "boss" : "w" + L.world);
    S = resume ? Object.assign(freshRun(n), JSON.parse(JSON.stringify(resume))) : freshRun(n);
    S.mode = "play"; S.maxLives = Math.max(S.maxLives || 3, maxLivesNow());
    if (DF().calm && L.miniboss) S.mbDead = true;
    armed = {}; inv = 0; chestWarn = false; bossT = 2.5; crystalWait = 0; camZoom = 1; shake = 0; combo = 0; fireHeld = false;
    buildLevelScene(); placeHero(); applyState(); closeOverlay();
    $("area").textContent = `Nivel ${n} · ${LEVEL_NAMES[n]}`;
    camera.position.set(S.px, 30, S.pz + 20);
    $("joy").hidden = true; fireCd = 0;
    saveNow(false);
    if (L.boss) toast(`<span class="t-title">¡La Fortaleza de Regaliz!</span>¡Acércate y dispárale rayos ⚡! Esquiva sus bolas, sal del círculo rojo cuando salte y coge el cristal para el súper rayo. Cuando se marea, ¡le haces el doble de daño!`, 6000);
    else toast(`<span class="t-title">Nivel ${n}: ${LEVEL_NAMES[n]}</span>${resume ? "Sigues donde lo dejaste." : `${WORLDS[L.world].name}. Consigue 3 llaves y abre el cofre del tesoro.`}${L.miniboss ? ` <b>¡Cuidado! El ${L.miniboss.name} protege el cofre.</b>` : ""}`, 4600);
  }
  function levelComplete() {
    if (S.mode !== "play") return;
    S.mode = "done";
    const n = S.n, stars = Object.keys(S.first).length, prev = P.levels[n];
    P.levels[n] = { stars: Math.max(stars, prev ? prev.stars || 0 : 0) };
    const unlockedNew = P.maxLevel <= n && n < LAST; P.maxLevel = Math.max(P.maxLevel, Math.min(LAST, n + 1)); checkStickers();
    SAVED = null; lsSet(SAVE_KEY, null); saveNow(false);
    sfx.win(); candyRain(); express("happy", 5000); $("joy").hidden = true;
    overlay(`<div class="tag">Nivel ${n} · ${LEVEL_NAMES[n]}</div><h2>¡Nivel superado!</h2>
      <div class="big-stars" aria-label="${stars} estrellas de 3">${starsTxt(stars)}</div>
      <p class="story" style="text-align:center">${stars === 3 ? "¡Todos los retos a la primera! Eres increíble." : "Las estrellas se ganan acertando los retos a la primera. ¡Puedes repetir el nivel para conseguirlas todas!"}</p>
      <div class="score"><span class="pill">🍬 ${P.candies} caramelos</span><span class="pill">⭐ ${totalStars()} estrellas en total</span><span class="pill">🍭 ${(L.giants || []).filter((_, k) => S.taken["g" + k]).length}/${(L.giants || []).length} golosinas gigantes</span></div>
      ${unlockedNew && n === 20 ? `<div class="hint">¡Se ha abierto la <b>Fortaleza de Regaliz</b>! El brujo te espera.</div>` : ""}
      <div class="row"><button class="btn primary" id="next">${n + 1 === LAST ? "¡Ir a por el brujo!" : "Siguiente nivel"}</button><button class="btn" id="toMap">🗺️ Mapa</button><button class="btn" id="toWard">👗 Vestidor</button></div>`);
    $("next").onclick = () => startLevel(Math.min(LAST, n + 1));
    $("toMap").onclick = showMap; $("toWard").onclick = () => { leaveLevelState(); showWardrobe(showMap); };
  }
  function failLevel() {
    if (!S || S.mode === "fail") return;
    stopMini(); CUR = null; const n = S.n; S.mode = "fail";
    if (!P.found.includes("sueno")) P.found.push("sueno");
    SAVED = null; lsSet(SAVE_KEY, null); saveNow(false);
    sfx.sleep(); $("joy").hidden = true; updateObjective();
    overlay(`<div class="tag">Nivel ${n}</div><h2>${ENDINGS.sueno.title}</h2><div class="big-art">${ENDINGS.sueno.art}</div><p class="story">${ENDINGS.sueno.text(esc(P.name))}</p>
      <div class="score"><span class="pill">🍬 ${P.candies} caramelos (no los pierdes)</span></div>
      <div class="hint">Truco: en el vestidor, la mejora ★★ de cada traje te da un corazón más en cada nivel.</div>
      <div class="row"><button class="btn primary" id="retry">Reintentar el nivel</button><button class="btn" id="toWard">👗 Vestidor</button><button class="btn ghost" id="toMap">Mapa</button></div>`);
    $("retry").onclick = () => startLevel(n);
    $("toWard").onclick = () => { leaveLevelState(); showWardrobe(showMap); };
    $("toMap").onclick = showMap;
  }
  function bossDefeated() {
    if (!S) return;
    S.mode = "done"; music.set("menu");
    const crown = totalStars() >= STARS_FOR_CROWN, key = crown ? "corona" : "victoria";
    P.levels[LAST] = { stars: 3 };
    [key, "victoria"].forEach(k => { if (!P.found.includes(k)) P.found.push(k); });
    addCandies(200);
    SAVED = null; lsSet(SAVE_KEY, null); saveNow(false);
    sfx.win(); candyRain(); express("happy", 8000); $("joy").hidden = true; updateObjective(); renderStats();
    const E = ENDINGS[key];
    overlay(`<div class="tag">¡Has vencido al jefe final!</div><h2>${E.title}</h2><div class="big-art">${E.art}</div>
      <p class="story">${E.text(esc(P.name))}</p>
      <div class="score"><span class="pill">🍬 +200 caramelos de premio</span><span class="pill">⭐ ${totalStars()} estrellas</span></div>
      ${crown ? "" : `<div class="hint">Hay un final secreto si vences al brujo con ${STARS_FOR_CROWN} estrellas o más. ¡Repite niveles para conseguirlas!</div>`}
      <div class="tag" style="margin-top:10px">Finales descubiertos</div>${endingsGrid()}
      <div class="row"><button class="btn primary" id="toMap">🗺️ Volver al mapa</button><button class="btn" id="toWard">👗 Vestidor</button></div>`);
    $("toMap").onclick = showMap; $("toWard").onclick = () => { leaveLevelState(); showWardrobe(showMap); };
  }
  function candyRain() {
    if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    for (let i = 0; i < 30; i++) {
      const s = document.createElement("span"); s.className = "candy"; s.textContent = pick(["🍬", "🍭", "🧁", "🍩", "⭐", "💎", "🗝️"]);
      s.style.left = Math.random() * 100 + "vw"; s.style.animationDuration = (2.5 + Math.random() * 2.5) + "s"; s.style.animationDelay = (Math.random() * 1.2) + "s";
      document.body.appendChild(s); setTimeout(() => s.remove(), 6500);
    }
  }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") saveNow(false); });

  // ================= Arranque =================
  function start(data) {
    $("loading").remove();
    placeHero();
    if (data && data.S && data.S.v === 2 && (data.S.mode === "play" || data.S.mode === "modal")) startLevel(data.S.n, data.S);
    else showMenu();
    requestAnimationFrame(loop);
    initCloud();
  }
  window.__reino = { get S() { return S; }, get CUR() { return CUR; }, get P() { return P; }, get L() { return L; }, get LV() { return LV; }, startLevel };
  if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({ S: S && Object.assign({}, S) }));
  const boot = () => (window.claude && window.claude.hot && window.claude.hot.ready) ? window.claude.hot.ready(start) : start((window.claude && window.claude.hot && window.claude.hot.data) || {});
  const fontsReady = (document.fonts && document.fonts.load) ? Promise.race([Promise.all([document.fonts.load('800 54px "Baloo 2"'), document.fonts.load('40px "Lilita One"')]), new Promise(r => setTimeout(r, 1800))]) : Promise.resolve();
  fontsReady.then(boot, boot);
})();
</script>
</body>
</html>
