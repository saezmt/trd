<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mansión Calabaza 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Griffy&family=Baloo+2:wght@400;600;800&display=swap">
<style>
/* Layout: mundo 3D a pantalla completa; marcador flotante arriba, objetivo abajo y retos en una tarjeta superpuesta. Tema nocturno fijo. */
:root {
  --night: #0d0819;
  --night-2: #241843;
  --ink: #f6eeff;
  --muted: #b9a8d9;
  --pumpkin: #ff8a1f;
  --pumpkin-deep: #d9620a;
  --slime: #9be564;
  --candle: #ffd36b;
  --blood: #ff5c7a;
  --sand: #e9c98f;
  --card: #2b1d4f;
  --card-edge: #4a3680;
  --glass: rgba(18, 11, 34, .78);
  --display: "Griffy", "Papyrus", fantasy;
  --body: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--night); color: var(--ink); font-family: var(--body); font-size: 18px; line-height: 1.4; overflow: hidden; -webkit-user-select: none; user-select: none; }
#world { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

/* HUD */
.hud { position: fixed; left: 0; right: 0; top: 0; padding: calc(env(safe-area-inset-top, 0px) + 10px) 12px 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; pointer-events: none; z-index: 5; }
.hud-left { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; min-width: 0; }
.hud-right { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; pointer-events: auto; }
.pill { background: var(--glass); border: 2px solid var(--card-edge); border-radius: 999px; padding: 2px 12px; font-weight: 800; white-space: nowrap; font-variant-numeric: tabular-nums; backdrop-filter: blur(4px); }
.pill .lbl { font-weight: 600; color: var(--muted); font-size: 13px; margin-right: 4px; }
#area { font-family: var(--display); font-weight: 400; color: var(--candle); font-size: 20px; padding: 2px 14px; max-width: 60vw; overflow: hidden; text-overflow: ellipsis; }
#mini { width: 148px; height: 132px; border-radius: 12px; border: 2px solid var(--card-edge); background: var(--glass); image-rendering: pixelated; }
.icon-btn { background: var(--glass); color: var(--ink); border: 2px solid var(--card-edge); border-radius: 999px; padding: 2px 12px; font: inherit; font-weight: 700; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--candle); outline-offset: 2px; }

#objective { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); z-index: 5; max-width: min(560px, calc(100% - 32px)); text-align: center; background: var(--glass); border: 2px solid var(--card-edge); border-radius: 16px; padding: 6px 14px; font-weight: 700; pointer-events: none; }
#objective b { color: var(--candle); }
#toast { position: fixed; left: 50%; top: 30%; transform: translate(-50%, -50%); z-index: 6; width: min(520px, calc(100% - 32px)); text-align: center; background: var(--glass); border: 3px solid var(--pumpkin); border-radius: 18px; padding: 12px 18px; font-weight: 700; pointer-events: none; opacity: 0; transition: opacity .35s; }
#toast.show { opacity: 1; }
#toast .t-title { font-family: var(--display); font-weight: 400; font-size: 26px; color: var(--candle); display: block; }

/* Joystick táctil */
#joy { position: fixed; left: calc(env(safe-area-inset-left, 0px) + 22px); bottom: calc(env(safe-area-inset-bottom, 0px) + 70px); width: 130px; height: 130px; border-radius: 50%; background: rgba(255, 255, 255, .08); border: 3px solid rgba(255, 211, 107, .4); z-index: 5; touch-action: none; }
#knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ffb35c, var(--pumpkin-deep)); box-shadow: 0 4px 10px rgba(0,0,0,.5); }

/* Tarjetas superpuestas */
.overlay { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px calc(env(safe-area-inset-bottom, 0px) + 12px); background: rgba(8, 4, 18, .55); backdrop-filter: blur(2px); }
.card { width: min(680px, 100%); max-height: 100%; overflow-y: auto; background: linear-gradient(180deg, var(--card), #22173f); border: 3px solid var(--card-edge); border-radius: 22px; padding: clamp(16px, 4vw, 28px); box-shadow: 0 14px 40px rgba(0, 0, 0, .55); animation: rise .35s ease-out; -webkit-user-select: text; user-select: text; }
@keyframes rise { from { transform: translateY(14px) scale(.98); opacity: .3; } to { transform: none; opacity: 1; } }
.logo { font-family: var(--display); font-weight: 400; font-size: clamp(32px, 8vw, 50px); color: var(--pumpkin); margin: 0; line-height: 1.05; text-shadow: 0 3px 0 #000, 0 0 18px rgba(255, 138, 31, .45); text-wrap: balance; }
h2 { font-family: var(--display); font-weight: 400; font-size: clamp(26px, 6vw, 36px); margin: 2px 0 6px; color: var(--candle); text-wrap: balance; line-height: 1.1; }
.tag { font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--slime); font-weight: 800; }
.story { margin: 0 0 12px; }
.story em { color: var(--candle); font-style: normal; font-weight: 700; }
.big-art { font-size: clamp(54px, 14vw, 84px); text-align: center; animation: wobble 2.6s ease-in-out infinite; }
@keyframes wobble { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg) translateY(-4px); } }
.cat { display: inline-block; font-size: 13px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; padding: 2px 10px; border-radius: 999px; margin-bottom: 8px; color: #1b1030; }
.cat.mates { background: var(--pumpkin); }
.cat.geo { background: var(--slime); }
.cat.geom { background: var(--candle); }
.cat.jero { background: var(--sand); }
.cat.mini { background: #c9a4ff; }
.cat.gold { background: linear-gradient(90deg, #ffe08a, #e0a91a); }
.q { font-size: 20px; font-weight: 600; margin: 0 0 12px; }
.figure { display: flex; justify-content: center; margin: 6px 0 12px; overflow-x: auto; }
.figure svg { max-width: 100%; height: auto; }
.rebus { font-size: clamp(40px, 11vw, 60px); text-align: center; font-weight: 800; letter-spacing: 2px; margin: 4px 0 10px; color: var(--candle); }
.cipher { font-size: clamp(30px, 8vw, 44px); text-align: center; letter-spacing: 6px; margin: 6px 0 10px; background: rgba(233, 201, 143, .12); border: 2px solid var(--sand); border-radius: 14px; padding: 6px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 10px; }
.legend span { background: #120b22; border: 2px solid var(--card-edge); border-radius: 10px; padding: 2px 8px; font-weight: 800; font-size: 18px; }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.btn { font: inherit; font-weight: 800; font-size: 19px; cursor: pointer; background: var(--night-2); color: var(--ink); border: 3px solid var(--card-edge); border-radius: 14px; padding: 9px 14px; transition: transform .12s, background .12s, border-color .12s; }
.btn:hover:not(:disabled) { transform: translateY(-2px); border-color: var(--pumpkin); background: #33245e; }
.btn:disabled { opacity: .35; cursor: not-allowed; }
.opt:disabled { text-decoration: line-through; }
.btn.primary { background: var(--pumpkin); color: #2a1300; border-color: var(--pumpkin-deep); box-shadow: 0 5px 0 var(--pumpkin-deep); }
.btn.primary:hover { background: #ff9c3f; border-color: var(--pumpkin-deep); }
.btn.ghost { background: transparent; color: var(--muted); border-color: transparent; font-size: 16px; }
.answer-row, .intro-input, .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row { margin-top: 14px; }
.answer-row input, .intro-input input { font: inherit; font-weight: 800; background: #120b22; color: var(--ink); border: 3px solid var(--card-edge); border-radius: 14px; padding: 6px 12px; }
.answer-row input { font-size: 24px; width: 140px; text-align: center; }
.intro-input input { font-size: 20px; flex: 1 1 200px; min-width: 0; }
.feedback { min-height: 26px; margin-top: 10px; font-weight: 700; }
.feedback.bad { color: var(--blood); }
.feedback.good { color: var(--slime); }
.hint { margin-top: 8px; background: rgba(255, 211, 107, .12); border-left: 4px solid var(--candle); padding: 8px 12px; border-radius: 8px; color: var(--candle); }
.shake { animation: shake .4s; }
@keyframes shake { 20%,60% { transform: translateX(-8px); } 40%,80% { transform: translateX(8px); } }
.controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px; margin: 10px 0; }
.controls div { background: rgba(0,0,0,.25); border: 2px solid var(--card-edge); border-radius: 12px; padding: 8px 10px; font-size: 16px; }
.controls b { color: var(--candle); }
kbd { background: #120b22; border: 2px solid var(--card-edge); border-bottom-width: 4px; border-radius: 6px; padding: 0 6px; font-family: var(--body); font-weight: 800; font-size: 14px; }

/* Minijuegos */
.mg-canvas { display: block; width: 100%; max-width: 340px; margin: 0 auto; border-radius: 14px; border: 3px solid var(--card-edge); touch-action: none; background: #120b22; }
.mg-status { text-align: center; font-weight: 800; margin: 8px 0; font-variant-numeric: tabular-nums; }
.mem-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; max-width: 360px; margin: 0 auto; }
.mem-card { aspect-ratio: 1; font-size: clamp(26px, 8vw, 38px); border-radius: 12px; border: 3px solid var(--card-edge); background: repeating-linear-gradient(45deg, #3a2768 0 8px, #2e1f55 8px 16px); cursor: pointer; color: var(--ink); padding: 0; }
.mem-card.up { background: #f6eeff; }
.mem-card.done { background: #c8f5a8; border-color: #5fa832; }
.simon { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; max-width: 300px; margin: 0 auto; }
.simon button { aspect-ratio: 1.3; border-radius: 20px; font-size: 44px; border: 4px solid rgba(0,0,0,.35); cursor: pointer; opacity: .55; transition: opacity .1s, transform .1s; }
.simon button.lit { opacity: 1; transform: scale(1.06); box-shadow: 0 0 26px currentColor; }
.endings { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; margin-top: 8px; }
.end-slot { text-align: center; border: 2px solid var(--card-edge); border-radius: 14px; padding: 8px 6px; background: rgba(0,0,0,.25); font-size: 14px; }
.end-slot .e-art { font-size: 28px; }
.end-slot.locked { opacity: .45; }
.end-slot.found { border-color: var(--slime); }
.score { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin: 10px 0; }
.candy { position: fixed; top: -40px; font-size: 28px; pointer-events: none; z-index: 20; animation: drop linear forwards; }
@keyframes drop { to { transform: translateY(110vh) rotate(540deg); } }
#loading { position: fixed; inset: 0; display: grid; place-items: center; font-family: var(--display); font-size: 28px; color: var(--pumpkin); z-index: 30; background: var(--night); }

@media (max-width: 600px) {
  #mini { width: 104px; height: 93px; }
  #area { font-size: 16px; }
  .pill { font-size: 15px; padding: 1px 9px; }
  .pill .lbl { display: none; }
  #objective { font-size: 15px; bottom: calc(env(safe-area-inset-bottom, 0px) + 8px); }
  #joy { bottom: calc(env(safe-area-inset-bottom, 0px) + 64px); width: 116px; height: 116px; }
}
body.touch #objective { left: auto; right: 12px; transform: none; max-width: calc(100% - 180px); text-align: left; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<canvas id="world" aria-label="Mundo 3D de la Mansión Calabaza"></canvas>
<div class="hud">
  <div class="hud-left"><div class="pill" id="area">La Mansión Calabaza</div><canvas id="mini" width="148" height="132" aria-label="Mapa"></canvas></div>
  <div class="hud-right" id="stats"></div>
</div>
<div id="objective"></div>
<div id="toast" role="status"></div>
<div id="joy" hidden><div id="knob"></div></div>
<div class="overlay" id="overlay"><div class="card" id="panel"></div></div>
<div id="loading">Abriendo la mansión…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  "use strict";
  // ================= Utilidades =================
  const rand = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const $ = id => document.getElementById(id);

  // ================= Sonido =================
  let audio = null, soundOn = false;
  function tone(freq, dur, type, when, vol) {
    if (!soundOn) return null;
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const t = audio.currentTime + (when || 0);
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = type || "sine"; o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(vol || .16, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
      o.connect(g); g.connect(audio.destination); o.start(t); o.stop(t + dur);
      return o;
    } catch (e) { return null; }
  }
  const sfx = {
    good() { [523, 659, 784, 1046].forEach((f, i) => tone(f, .25, "triangle", i * .09)); },
    bad() { const o = tone(330, .6, "sawtooth", 0, .1); if (o) o.frequency.exponentialRampToValueAtTime(110, audio.currentTime + .6); },
    gate() { const o = tone(90, .8, "square", 0, .07); if (o) o.frequency.linearRampToValueAtTime(170, audio.currentTime + .8); },
    pick() { tone(880, .12, "triangle", 0, .12); tone(1320, .14, "triangle", .06, .1); },
    hit() { tone(660, .08, "square", 0, .08); },
    win() { [392, 523, 659, 784, 659, 784, 1046].forEach((f, i) => tone(f, .3, "triangle", i * .13)); },
    boo() { const o = tone(200, 1.2, "sine", 0, .2); if (o) o.frequency.linearRampToValueAtTime(120, audio.currentTime + 1.2); },
    zap() { const o = tone(300, .5, "sine", 0, .14); if (o) o.frequency.exponentialRampToValueAtTime(1600, audio.currentTime + .5); }
  };

  // ================= Dibujos de geometría (SVG) =================
  const STROKE = "#ffd36b";
  function polySVG(n) {
    const cx = 110, cy = 105, r = 80, pts = [];
    for (let i = 0; i < n; i++) { const a = -Math.PI / 2 + i * 2 * Math.PI / n; pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]); }
    const web = pts.map(p => `<line x1="${cx}" y1="${cy}" x2="${p[0].toFixed(1)}" y2="${p[1].toFixed(1)}" stroke="#b9a8d9" stroke-width="1" opacity=".5"/>`).join("");
    return `<svg viewBox="0 0 220 215" width="220" role="img" aria-label="Polígono">${web}<polygon points="${pts.map(p => p.map(v => v.toFixed(1)).join(",")).join(" ")}" fill="rgba(255,138,31,.18)" stroke="${STROKE}" stroke-width="5" stroke-linejoin="round"/><text x="${cx}" y="${cy + 12}" text-anchor="middle" font-size="34">🕷️</text></svg>`;
  }
  function rectSVG(w, h, a, b, unit) {
    const x = (260 - w) / 2, y = 30;
    return `<svg viewBox="0 0 260 ${h + 80}" width="260" role="img" aria-label="Rectángulo de ${a} por ${b}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="rgba(155,229,100,.15)" stroke="${STROKE}" stroke-width="5"/><text x="130" y="${y - 8}" text-anchor="middle" fill="#f6eeff" font-size="20" font-weight="800">${a} ${unit}</text><text x="${x + w + 8}" y="${y + h / 2 + 7}" fill="#f6eeff" font-size="20" font-weight="800">${b} ${unit}</text></svg>`;
  }
  function triSVG(s) {
    return `<svg viewBox="0 0 240 210" width="240" role="img" aria-label="Triángulo de lados iguales"><polygon points="120,25 30,180 210,180" fill="rgba(255,138,31,.18)" stroke="${STROKE}" stroke-width="5" stroke-linejoin="round"/><text x="120" y="205" text-anchor="middle" fill="#f6eeff" font-size="20" font-weight="800">${s} cm</text><text x="52" y="100" text-anchor="middle" fill="#f6eeff" font-size="20" font-weight="800">${s} cm</text><text x="188" y="100" text-anchor="middle" fill="#f6eeff" font-size="20" font-weight="800">${s} cm</text><text x="120" y="140" text-anchor="middle" font-size="34">🧙</text></svg>`;
  }
  function angleSVG(deg) {
    const ox = 60, oy = 170, L = 150, a = deg * Math.PI / 180;
    const x2 = ox + L * Math.cos(a), y2 = oy - L * Math.sin(a);
    const r = 36, ax = ox + r * Math.cos(a), ay = oy - r * Math.sin(a);
    const arc = deg === 90
      ? `<polyline points="${ox + 26},${oy} ${ox + 26},${oy - 26} ${ox},${oy - 26}" fill="none" stroke="#ff8a1f" stroke-width="4"/>`
      : `<path d="M ${ox + r} ${oy} A ${r} ${r} 0 0 0 ${ax.toFixed(1)} ${ay.toFixed(1)}" fill="none" stroke="#ff8a1f" stroke-width="4"/>`;
    return `<svg viewBox="0 0 260 190" width="260" role="img" aria-label="Un ángulo"><line x1="${ox}" y1="${oy}" x2="${ox + L + 40}" y2="${oy}" stroke="${STROKE}" stroke-width="6" stroke-linecap="round"/><line x1="${ox}" y1="${oy}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${STROKE}" stroke-width="6" stroke-linecap="round"/>${arc}<text x="${(x2 + 6).toFixed(1)}" y="${(y2 - 4).toFixed(1)}" font-size="26">🧹</text></svg>`;
  }
  function cubeSVG() {
    return `<svg viewBox="0 0 200 180" width="200" role="img" aria-label="Un cubo"><polygon points="40,60 120,60 120,150 40,150" fill="rgba(255,138,31,.25)" stroke="${STROKE}" stroke-width="4"/><polygon points="40,60 80,25 160,25 120,60" fill="rgba(255,211,107,.25)" stroke="${STROKE}" stroke-width="4"/><polygon points="120,60 160,25 160,115 120,150" fill="rgba(155,229,100,.2)" stroke="${STROKE}" stroke-width="4"/><text x="80" y="115" text-anchor="middle" font-size="34">🎁</text></svg>`;
  }
  function moonSVG() {
    return `<svg viewBox="0 0 220 200" width="220" role="img" aria-label="Círculo con una línea por el centro"><circle cx="110" cy="100" r="80" fill="rgba(255,211,107,.22)" stroke="${STROKE}" stroke-width="5"/><line x1="30" y1="100" x2="190" y2="100" stroke="#ff8a1f" stroke-width="6" stroke-linecap="round"/><circle cx="110" cy="100" r="6" fill="#ff8a1f"/><text x="150" y="70" font-size="26">🦉</text></svg>`;
  }
  function squareSymSVG() {
    return `<svg viewBox="0 0 200 200" width="200" role="img" aria-label="Un cuadrado"><rect x="30" y="30" width="140" height="140" fill="rgba(155,229,100,.15)" stroke="${STROKE}" stroke-width="5"/><text x="100" y="118" text-anchor="middle" font-size="44">👻</text></svg>`;
  }
  function chocoSVG(rows, cols) {
    const s = Math.min(34, Math.floor(220 / cols)), w = cols * s, h = rows * s, x0 = (240 - w) / 2;
    let cells = "";
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) cells += `<rect x="${x0 + c * s + 2}" y="${10 + r * s + 2}" width="${s - 4}" height="${s - 4}" rx="4" fill="#6b3a1d" stroke="#3c1f0d" stroke-width="2"/>`;
    return `<svg viewBox="0 0 240 ${h + 20}" width="240" role="img" aria-label="Tableta de chocolate de ${rows} por ${cols}">${cells}</svg>`;
  }

  // ---- Números egipcios: trazo = 1, arco = 10, espiral = 100 ----
  const SAND = "#e9c98f";
  function egyGlyph(v, x) {
    if (v === 1) return { w: 14, s: `<line x1="${x + 7}" y1="8" x2="${x + 7}" y2="46" stroke="${SAND}" stroke-width="5" stroke-linecap="round"/>` };
    if (v === 10) return { w: 32, s: `<path d="M${x + 4} 46 V26 A12 12 0 0 1 ${x + 28} 26 V46" fill="none" stroke="${SAND}" stroke-width="5" stroke-linecap="round"/>` };
    const cx = x + 16, cy = 27;
    return { w: 34, s: `<path d="M${cx} ${cy} a3 3 0 1 1 6 0 a6 6 0 1 1 -12 0 a9 9 0 1 1 18 0 a12 12 0 1 1 -24 0" fill="none" stroke="${SAND}" stroke-width="4" stroke-linecap="round"/>` };
  }
  function egySVG(n, label) {
    const parts = [];
    for (let i = 0; i < Math.floor(n / 100); i++) parts.push(100);
    for (let i = 0; i < Math.floor(n % 100 / 10); i++) parts.push(10);
    for (let i = 0; i < n % 10; i++) parts.push(1);
    let x = 10, body = "";
    parts.forEach(p => { const g = egyGlyph(p, x); body += g.s; x += g.w + 4; });
    return `<svg viewBox="0 0 ${x + 6} 56" width="${Math.min(340, (x + 6) * 1.3)}" role="img" aria-label="${label || "Número egipcio"}"><rect x="1" y="1" width="${x + 4}" height="54" rx="8" fill="rgba(233,201,143,.1)" stroke="${SAND}" stroke-opacity=".4"/>${body}</svg>`;
  }
  function egyLegend() {

  function mgCatch(box, done) {
